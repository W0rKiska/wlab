# ============================================================================
#  WLAB :: единый конфиг
#  Лежит в /etc/wlab/wlab.conf
#
#  ВАЖНО: комментарий пиши ОТДЕЛЬНОЙ строкой, не в конце значения.
#  Строка вида  IFACE_AP="wlan0"   # комментарий  ломает Python-часть
#  (она читает значение буквально, вместе с хвостом).
# ============================================================================

# --- АДАПТЕРЫ ---------------------------------------------------------------

# боевой адаптер (AR9271): скан, деаут, ловля хендшейков
IFACE_MON="wlan1"

# адаптер точки доступа (Realtek): поднимает AP
IFACE_AP="wlan0"

# адаптер для скана эфира: тот же, что держит точку (AP и скан одновременно нельзя)
IFACE_SCAN="wlan0"

# BLE-донгл nRF52840. Лучше /dev/nrf52 через udev (см. README)
IFACE_BLE="/dev/ttyACM0"

# аплинк для NAT. Пусто = определим по default route автоматически
IFACE_UP=""

# --- ТОЧКА ДОСТУПА ----------------------------------------------------------

AP_SSID="FreeWiFi"

# пусто = открытая сеть
AP_PASS=""

AP_IP="192.168.50.1"
AP_PREFIX="24"
DHCP_RANGE="192.168.50.10,192.168.50.100"
CHANNEL_DEFAULT="6"
PORTAL_DIR="/opt/wlab/share/portal"

# --- ПОВЕДЕНИЕ --------------------------------------------------------------

# 1 = раздавать интернет клиентам точки
ENABLE_NAT="1"

# 1 = рандомить MAC перед работой
ANON_MAC="1"

# 1 = писать машинночитаемые логи в /var/log/wlab/*.jsonl
LOG_JSONL="1"

# сколько строк показывать в live-таблицах
SCAN_LIMIT="15"
